name: Infusion Pump CI

on:
  push:
    branches: [ main, master, ci-setup, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build lcov g++

      - name: Configure host/native test build
        run: cmake -B build_tests -S test -DCMAKE_BUILD_TYPE=Debug -GNinja

      - name: Build tests
        run: cmake --build build_tests

      - name: Run GTests
        run: ctest --test-dir build_tests --output-on-failure

      - name: Generate lcov coverage report
        run: |
          lcov --capture --directory build_tests --output-file coverage.info --ignore-errors mismatch --rc branch_coverage=1
          lcov --remove coverage.info '/usr/*' '*/test_*.cpp' '*/test_files/*' '*/stubs/*' '*/test/*' '*/_deps/*' --output-file coverage.info --ignore-errors unused --rc branch_coverage=1
          lcov --list coverage.info --rc branch_coverage=1

      - name: Generate HTML coverage report
        run: genhtml coverage.info --output-directory coverage_html --rc branch_coverage=1

      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v4
        with:
          name: infusion-pump-coverage-html
          path: coverage_html/