# ============================================================
# Language / Toolchain
# ============================================================

# Enables C++ compilation support in Zephyr build
CONFIG_CPP=y

# Project spec requires C++20 - enables C++20 language standard
CONFIG_STD_CPP20=y

# Zephyr's minimal C++ lib lacks <cmath>/<algorithm>/etc - pulls in full stdlib
CONFIG_REQUIRES_FULL_LIBCPP=y

# Disables RTTI (dynamic_cast/typeid) - unused in this project, saves flash/RAM
CONFIG_CPP_RTTI=n

# Disables C++ exceptions - not allowed in safety-critical firmware (MISRA-style rule)
CONFIG_CPP_EXCEPTIONS=n


# ============================================================
# Core System
# ============================================================

# Disables Zephyr's heap entirely - enforces "no malloc/new" project rule
CONFIG_HEAP_MEM_POOL_SIZE=0

# Enables runtime assertions - catches invalid states early during development
CONFIG_ASSERT=y

# Required to inspect stack usage/watermarks (project rule: keep usage <=75%)
CONFIG_THREAD_STACK_INFO=y

# Delay before main() starts - lets USB/serial terminal attach before first printk
CONFIG_BOOT_DELAY=1000

# Enables hardware FPU - used for float rate/volume calculations
CONFIG_FPU=y


# ============================================================
# GPIO
# ============================================================

# Required for LED, buzzer, direction, enable, encoder pins
CONFIG_GPIO=y


# ============================================================
# PWM (stepper step signal)
# ============================================================

# Required for TIM2/PA0 PWM step generation
CONFIG_PWM=y


# ============================================================
# I2C + Sensor (LPS22HB pressure sensor)
# ============================================================

CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_LPS22HB=y


# ============================================================
# UART (console)
# ============================================================

# Enables UART driver subsystem
CONFIG_SERIAL=y

# Routes printk/console output over UART
CONFIG_UART_CONSOLE=y

# Enables console subsystem
CONFIG_CONSOLE=y

# Enables printk() output
CONFIG_PRINTK=y


# ============================================================
# Logging
# ============================================================

# Logging disabled - using printk directly for this project
CONFIG_LOG=n

CONFIG_HEAP_MEM_POOL_SIZE=0