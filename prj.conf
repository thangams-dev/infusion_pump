# Enables C++ compilation in Zephyr
CONFIG_CPP=y

# Enables C++20 language standard
CONFIG_STD_CPP20=y

# Pulls in full C++ standard library (STL) - needed for atomic, cmath, etc
CONFIG_REQUIRES_FULL_LIBCPP=y

# Disables RTTI (dynamic_cast/typeid) - saves flash/RAM
CONFIG_CPP_RTTI=n

# Disables C++ exceptions
CONFIG_CPP_EXCEPTIONS=n

# Core System

# Enables runtime assertions - catches invalid states early during development
CONFIG_ASSERT=y

# Required to inspect stack usage/watermrks (project rule: keep usage <=75%)
CONFIG_THREAD_STACK_INFO=y

# Delay before main() starts - lets USB/serial terminal attach before first printk
CONFIG_BOOT_DELAY=1000

# Enables hardware FPU - used for float rate/volume calc; without this, float ops run in slow software emulation
CONFIG_FPU=y

# GPIO

# Required for LED, buzzer, direction, enable, encoder pins
CONFIG_GPIO=y

# PWM (stepper step signal)

# Required for TIM2/PA0 PWM step generation
CONFIG_PWM=y

# I2C + Sensor (LPS22HB pressure sensor)

# Enables the I2C bus driver subsyem
CONFIG_I2C=y

# Enables Zephyr's generic Sensor API
CONFIG_SENSOR=y

# Enables the specific driver for exact sensor chip (LPS22HB)
CONFIG_LPS22HB=y

# UART (console)

# Enables UART driver subsystem
CONFIG_SERIAL=y

# Routes printk/console output over UART
CONFIG_UART_CONSOLE=y

# Enables console subsystem
CONFIG_CONSOLE=y

# Enables printk() output
CONFIG_PRINTK=y

# Logging

# Logging disabled - using printk directly for this project
CONFIG_LOG=n

# Disables Zephyr heap (0 bytes) - enforces "no malloc/new" project rule
CONFIG_HEAP_MEM_POOL_SIZE=0